[project]
name = "qma"
version = "2.0.1"
description = "Quantitative Market Anomaly (QMA) - Autonomous Agent Marketplace & Intelligence Protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.124.4",
    "scalar-fastapi==1.8.2",
    "uvicorn[standard]==0.38.0",
    "requests==2.32.5",
    "pydantic==2.12.5",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.8.0",
    "eth-account==0.13.7",
    "genlayer-py==0.18.0",
    "mcp>=1.10,<2",
    "starlette>=0.40,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
